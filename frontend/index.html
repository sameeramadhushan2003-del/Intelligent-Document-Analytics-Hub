<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <meta
      name="description"
      content="An intelligent document analytics platform powered by RAG and AI"
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("document-hub.theme.v1");
          const mode = ["system", "light", "dark"].includes(stored) ? stored : "system";
          const dark = mode === "dark" ||
            (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themeMode = mode;
        } catch {
          const dark = matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themeMode = "system";
        }
      })();
    </script>
    <title>Intelligent Document Analytics Hub</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
