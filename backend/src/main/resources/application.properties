
spring.application.name=backend

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/document_analytics_hub
spring.datasource.username=document_hub_app
spring.datasource.password=${DB_PASSWORD}

app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.connect-timeout=3s
app.ollama.read-timeout=45s

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Never include internal exception details in HTTP error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
security.jwt.secret-base64=${JWT_SECRET_BASE64}


# ======================================
# Private Document Storage Configuration
# ======================================

# Uploaded files are stored outside the project repository.
app.storage.root=${DOCUMENT_STORAGE_DIR:${user.home}/DocumentAnalyticsHub/private-uploads}

# Maximum allowed upload size: 10 MB per file.
spring.servlet.multipart.max-file-size=10MB

# Maximum multipart request size: 12 MB.
spring.servlet.multipart.max-request-size=12MB
